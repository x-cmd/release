name: release
on:
  # push:
  workflow_dispatch:
    inputs:
      skip-release-other:
        description: 'if skip release other packages'
        required: false

jobs:
  release-worker:
    runs-on: ubuntu-latest
    env:
      ___X_CMD_GHACTION_X: x2
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
      QYWX_BOT_RELEASE_WEBHOOK: ${{ secrets.QYWX_BOT_RELEASE_WEBHOOK }}
      ssh_key: ${{ secrets.SSH_PRIVATE_KEY_FOR_SYNC }}
      git_user: l
      git_email: l@x-cmd.com
      CONCURRENCY: 10
      SKIP_RELEASE_OTHER: ${{ github.event.inputs.skip-release-other }}
    steps:
      - name: main
        uses: x-cmd/action@main
        with:
          code: |
            x ws fabu-release

